name: Release

on:
  push:
    tags:
      - '**'

jobs:
    release:
      runs-on: ubuntu-latest

      permissions:
        contents: write

      env:
        GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      steps:
        - name: Clone project
          uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: BigWigsPackager
          uses: BigWigsMods/packager@v2
          with:
            args: -n "{package-name}-{project-version}"
